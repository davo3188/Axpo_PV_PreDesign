<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PV Predesign · SDK tests</title>
<script src="https://js.arcgis.com/4.34/"></script>
<style>
  :root { --ok: #1f8a4c; --err: #c0392b; --mut: #667; --bg: #fff; --txt: #111; --line: #e3e6ea; }
  @media (prefers-color-scheme: dark) { :root { --ok: #4cc38a; --err: #ff6b5e; --mut: #9aa; --bg: #12181f; --txt: #e8edf2; --line: #2a333d; } }
  body { font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--txt); margin: 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; } #sum { margin: 0 0 16px; color: var(--mut); }
  table { border-collapse: collapse; width: 100%; max-width: 960px; }
  td { border-bottom: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
  td.s { width: 56px; font-weight: 700; } .ok { color: var(--ok); } .err { color: var(--err); }
  code { font-size: 12px; color: var(--mut); }
</style>
</head>
<body>
<h1>PV Predesign · SDK and local frame tests</h1>
<p id="sum">running…</p>
<table id="out"></table>
<script type="module">
import { loadSdk } from '../app/js/sdk.js';
import { makeLocalFrame, ringsOf } from '../app/js/geo/localframe.js';
const results = [];
async function test(name, fn) {
  try { const note = await fn(); results.push({ name, ok: true, note: note ?? '' }); }
  catch (e) { results.push({ name, ok: false, note: e && e.message || String(e) }); }
}
const assert = (c, m) => { if (!c) throw new Error(m); };
const near = (a, b, tol, w) => assert(Math.abs(a - b) <= tol, `${w}: ${a} vs ${b}`);

const sdk = await loadSdk();
const { Polygon, SpatialReference, bufferOperator, unionOperator, differenceOperator, geodeticAreaOperator, areaOperator } = sdk;
const frame = makeLocalFrame({ lon0: 12.644, lat0: 45.6887 });
const rect = (x0, y0, x1, y1) => new Polygon({ rings: [[[x0, y0], [x0, y1], [x1, y1], [x1, y0], [x0, y0]]], spatialReference: frame.sr });

await test('local frame: 100 x 50 m is 5000 m2 on the ellipsoid', () => {
  const wgs = frame.toSr(rect(0, 0, 100, 50), SpatialReference.WGS84);
  const a = geodeticAreaOperator.execute(wgs, { unit: 'square-meters' });
  near(a, 5000, 1e-4, 'geodetic area');
  return `${a.toFixed(6)} m²`;
});
await test('local frame: exact far from the centre (2 km away)', () => {
  const wgs = frame.toSr(rect(2000, 2000, 2100, 2050), SpatialReference.WGS84);
  const a = geodeticAreaOperator.execute(wgs, { unit: 'square-meters' });
  near(a, 5000, 0.01, 'geodetic area');
  return `${a.toFixed(4)} m²`;
});
await test('round trip WGS84 <-> local', () => {
  const r = rect(10, 20, 30, 40), back = frame.toLocal(frame.toSr(r, SpatialReference.WGS84));
  ringsOf(back)[0].forEach((p, i) => { near(p[0], r.rings[0][i][0], 1e-6, 'x'); near(p[1], r.rings[0][i][1], 1e-6, 'y'); });
});
await test('setback: negative buffer of 100 x 50 by 5 m is 90 x 40', () => {
  const b = bufferOperator.execute(rect(0, 0, 100, 50), -5);
  near(areaOperator.execute(b), 3600, 1e-6, 'area');
  return `${areaOperator.execute(b)} m²`;
});
await test('union and difference', () => {
  const u = unionOperator.executeMany([rect(0, 0, 100, 50), rect(50, 0, 150, 50)]);
  near(areaOperator.execute(u), 7500, 1e-6, 'union');
  const d = differenceOperator.execute(u, rect(20, 10, 40, 30));
  near(areaOperator.execute(d), 7100, 1e-6, 'difference with a hole');
  assert(d.rings.length === 2, 'hole kept as a ring');
  return 'union 7500 m², with a 400 m² hole 7100 m²';
});

const ok = results.filter(r => r.ok).length;
document.getElementById('sum').innerHTML = `<b class="${ok === results.length ? 'ok' : 'err'}">${ok} / ${results.length} passed</b>`;
document.getElementById('out').innerHTML = results.map(r => `<tr><td class="s ${r.ok ? 'ok' : 'err'}">${r.ok ? 'PASS' : 'FAIL'}</td><td>${r.name}<br><code>${r.note}</code></td></tr>`).join('');
window.__results = results;
</script>
</body>
</html>
